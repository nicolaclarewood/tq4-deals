<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRRR Deal Finder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#f4f5f2;--card:#fff;--ink:#16201f;--muted:#5f6b69;--line:#e1e4de;
  --brand:#0f3d3e;--brand2:#1d6b5f;--good:#16794a;--bad:#b42318;--warn:#b26b00;--chip:#eef1ec;--blue:#1f5fbf;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1413;--card:#172120;--ink:#e8eeec;--muted:#93a29f;--line:#25312f;
  --brand:#0b2b2c;--brand2:#3fb39b;--good:#4cc38a;--bad:#ff7a6b;--warn:#f0b44c;--chip:#1e2a28;--blue:#7fb0ff;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--brand);color:#fff}
.wrap{max-width:1240px;margin:0 auto;padding:0 18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0 4px;flex-wrap:wrap}
.top h1{margin:0;font-size:21px}
.top a{color:#fff;text-decoration:none;font-weight:600;background:rgba(255,255,255,.14);padding:8px 14px;border-radius:9px}
.top a:hover{background:rgba(255,255,255,.22)}
.sub{color:rgba(255,255,255,.75);font-size:13.5px;padding-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0 12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.stat:hover{border-color:var(--brand2)}
.stat .v{font-size:26px;font-weight:750;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted)}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 13px;border-radius:20px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.chip.on{background:var(--brand2);border-color:var(--brand2);color:#fff}
.controls select,.controls input[type=search]{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 11px;border-radius:9px;font:inherit;font-size:14px}
.controls input[type=search]{flex:1;min-width:180px}
.spacer{flex:1}
.count{color:var(--muted);font-size:13.5px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:3/2;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tags{position:absolute;left:8px;top:8px;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.3px;padding:3px 7px;border-radius:5px;color:#fff}
.t-new{background:var(--good)}.t-flat{background:var(--blue)}.t-red{background:var(--bad)}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.price{font-size:21px;font-weight:750;font-variant-numeric:tabular-nums}
.price small{font-size:12.5px;font-weight:500;color:var(--muted)}
.was{font-size:13px;color:var(--bad);font-variant-numeric:tabular-nums}
.what{font-weight:650}
.addr{color:var(--ink)}
.meta{font-size:12.5px;color:var(--muted)}
.links{font-size:13px;display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.links a{color:var(--brand2);font-weight:600;text-decoration:none}
.links a:hover{text-decoration:underline}
.acts{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.btn{flex:1;text-align:center;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 10px;border-radius:9px;font:inherit;font-weight:650;font-size:14px;cursor:pointer;text-decoration:none}
.btn.p{background:var(--brand2);border-color:var(--brand2);color:#fff}
.hist{display:none;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;font-variant-numeric:tabular-nums}
.hist.on{display:block}
.hist div{display:flex;justify-content:space-between}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 10px}
.tabs{display:flex;gap:4px;margin-top:2px}
.tabs button{background:transparent;border:0;color:rgba(255,255,255,.7);font:inherit;font-weight:650;font-size:15px;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer}
.tabs button.on{background:var(--bg);color:var(--ink)}
.tab{display:none}.tab.on{display:block}
.comp{font-size:13px;background:var(--chip);border-radius:8px;padding:7px 9px;margin-top:4px}
.comp b{font-variant-numeric:tabular-nums}
.comp .below{color:var(--good);font-weight:650}.comp .above{color:var(--warn);font-weight:650}
.clist{display:none;font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.clist.on{display:block}
.clist div{display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line)}
.clist div span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clist .ss{color:var(--brand2);font-weight:650}
#map{height:calc(100vh - 230px);min-height:420px;border-radius:14px;border:1px solid var(--line);margin:14px 0 8px}
.mapbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:30px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.leaflet-popup-content{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:10px 12px}
.pop img{width:200px;height:120px;object-fit:cover;border-radius:6px;display:block;margin-bottom:6px}
.pop b{font-size:15px}.pop a{color:#1d6b5f;font-weight:650}
.sstats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:16px 0 12px}
table.sold{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
table.sold th{text-align:left;font-size:12px;color:var(--muted);font-weight:650;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--chip)}
table.sold td{padding:8px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.sold td.num,table.sold th.num{text-align:right}
.more{display:block;margin:12px auto 0}
.attr{font-size:11.5px;color:var(--muted);margin:14px 0 40px}
@media (max-width:640px){.sstats{grid-template-columns:repeat(2,minmax(0,1fr))}table.sold .hide-s{display:none}}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.top h1{font-size:18px}}
</style>
</head>

t Licence v3.0. Postcode locations from postcodes.io (ONS / OS data \u00a9 Crown copyright)."}};
const $ = id => document.getElementById(id);
const gbp = n => n==null ? "–" : "£" + Math.round(n).toLocaleString("en-GB");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dfmt = iso => { if(!iso) return ""; const d = new Date(iso + "T12:00:00"); return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); };
const mfmt = iso => { if(!iso) return ""; const d = new Date(iso + "T12:00:00"); return d.toLocaleDateString("en-GB",{month:"short",year:"numeric"}); };
const TYPEWORD = {F:"flats", T:"terraced houses", S:"semis", D:"detached houses", TSD:"houses"};
const TYPENAME = {F:"Flat", T:"Terraced", S:"Semi", D:"Detached", O:"Other"};
const SOLD_YRS = (DATA && DATA.soldInfo && DATA.soldInfo.years) || 3;
const weekAgo = new Date(Date.now() - 7*864e5).toISOString().slice(0,10);

const LS = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
             set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
let st = Object.assign({view:"all", flats:false, sort:"rec", q:"", beds:""}, LS.get("brrr_dash", {}));

const LIST = (DATA && DATA.listings) || [];
LIST.forEach(p => {
  p.newWeek = p.isNew && p.firstSeen >= weekAgo;
  p.cut = p.was ? p.was - p.price : 0;
  p.text = [p.address, p.type, p.title, p.agent].join(" ").toLowerCase();
});

function header(){
  if(!DATA){ $("sub").textContent = "No data yet – run the alert tool once to fill this page."; return; }
  const c = DATA.criteria;
  $("sub").textContent = `${c.minBeds}–${c.maxBeds} beds · ${gbp(c.minPrice)}–${gbp(c.maxPrice)} · within ${c.radius} miles of ${c.outcode} · updated ${DATA.generated}`;
  $("l_red").textContent = `Reduced in the last ${c.reducedMonths} months`;
  $("n_all").textContent = LIST.length;
  $("n_new").textContent = LIST.filter(p=>p.newWeek).length;
  $("n_red").textContent = LIST.filter(p=>p.reducedRecent).length;
  $("n_flat").textContent = LIST.filter(p=>p.flat).length;
}

function dealLink(p){
  const pre = { ask:p.price, name:`${p.beds} bed ${p.type||"property"}, ${p.address}`.slice(0,90),
                service: p.flat ? 100 : 0, listingUrl: p.links[0] ? p.links[0][2] : "", fromDashboard:1 };
  if(p.comps && p.comps.n) pre.comps = {median:p.comps.median, n:p.comps.n, radius:p.comps.radius, cls:p.comps.cls,
    min:p.comps.min, max:p.comps.max, yrs:SOLD_YRS, list:p.comps.list.slice(0,8).map(([pr,d,a,,,di,ss])=>[pr,d,a,di,ss?1:0])};
  return "deal-calculator.html#prefill=" + encodeURIComponent(JSON.stringify(pre));
}

function card(p){
  const tags = [];
  if(p.newWeek) tags.push('<span class="tag t-new">NEW</span>');
  if(p.flat) tags.push('<span class="tag t-flat">FLAT</span>');
  if(p.reducedRecent) tags.push(`<span class="tag t-red">REDUCED ${esc(dfmt(p.reducedDate)).toUpperCase()}</span>`);
  const img = p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy" onerror="this.remove()">` : "";
  const was = p.was ? `<div class="was">was ${gbp(p.was)} · down ${gbp(p.cut)} (${(p.cut/p.was*100).toFixed(1)}%)</div>`
            : (p.reducedRecent ? `<div class="was">Reduced ${esc(dfmt(p.reducedDate))} (previous price not published)</div>` : "");
  const meta = [p.dist!=null ? `${p.dist} mi from TQ4 centre` : "", p.agent, `first seen ${dfmt(p.firstSeen)}`].filter(Boolean).map(esc).join(" · ");
  const links = p.links.map(([, name, url]) => `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(name)} ↗</a>`).join("");
  const cp = p.comps;
  let comp = "";
  if(cp && cp.n){
    const diff = (p.price - cp.median) / cp.median * 100;
    const cmp = diff <= 0 ? `<span class="below">${Math.abs(diff).toFixed(0)}% below</span>` : `<span class="above">${diff.toFixed(0)}% above</span>`;
    const what = TYPEWORD[cp.cls] || "similar homes";
    comp = `<div class="comp">Sold nearby: median <b>${gbp(cp.median)}</b> · ${cp.n} ${what} within ${cp.radius} mi, ${SOLD_YRS} yrs. Asking is ${cmp}.
      <div class="clist">${cp.list.map(([pr,d,a,pc,t,di,ss]) => `<div><span>${esc(mfmt(d))}</span><span class="${ss?'ss':''}">${esc(a)}</span><span>${gbp(pr)}</span></div>`).join("")}
      <div style="border:0"><span></span><span>Range ${gbp(cp.min)}–${gbp(cp.max)}${cp.sameStreet ? ` · ${cp.sameStreet} on the same street (green)` : ""}</span><span></span></div></div></div>`;
  } else if(cp){
    comp = `<div class="comp">No ${TYPEWORD[cp.cls] || "similar"} sales within ${cp.radius} mi in the last ${SOLD_YRS} years.</div>`;
  }
  const hist = p.history.length > 1 ? p.history.map(([pr, d]) => `<div><span>${esc(dfmt(d))}</span><span>${gbp(pr)}</span></div>`).join("") : "";
  return `<div class="card">
    <div class="ph">${img}<span>${img ? "" : "No photo"}</span><div class="tags">${tags.join("")}</div></div>
    <div class="body">
      <div class="price">${gbp(p.price)} <small>${esc(p.qualifier)}</small></div>
      ${was}
      <div class="what">${p.beds} bed ${esc(p.type || "property")}</div>
      <div class="addr">${esc(p.address)}</div>
      <div class="meta">${meta}</div>
      <div class="links">${links}</div>
      ${comp}
      ${hist ? `<div class="hist">${hist}</div>` : ""}
      <div class="acts">
        ${cp && cp.n ? `<button class="btn" data-comps>Sold nearby</button>` : ""}
        ${hist ? `<button class="btn" data-hist>History</button>` : ""}
        <a class="btn p" href="${dealLink(p)}" target="_blank">Analyse deal</a>
      </div>
    </div></div>`;
}

const sorters = {
  rec: (a,b) => (b.flat-a.flat) || ((b.reducedRecent?b.reducedDate:"") > (a.reducedRecent?a.reducedDate:"") ? 1 : (b.reducedRecent?b.reducedDate:"") < (a.reducedRecent?a.reducedDate:"") ? -1 : 0) || a.price-b.price,
  newest: (a,b) => b.firstSeen.localeCompare(a.firstSeen) || a.price-b.price,
  cheap: (a,b) => a.price-b.price,
  dear: (a,b) => b.price-a.price,
  cut: (a,b) => (b.cut/(b.was||1)) - (a.cut/(a.was||1)) || ((b.reducedDate||"").localeCompare(a.reducedDate||"")),
  near: (a,b) => (a.dist ?? 99) - (b.dist ?? 99),
};

function render(){
  document.querySelectorAll(".chip[data-view]").forEach(c => c.classList.toggle("on", c.dataset.view === st.view));
  $("flatChip").classList.toggle("on", st.flats);
  $("sort").value = st.sort; $("q").value = st.q; $("beds").value = st.beds;
  const q = st.q.trim().toLowerCase();
  let list = LIST.filter(p =>
    (st.view === "all" || (st.view === "new" && p.newWeek) || (st.view === "reduced" && (p.reducedRecent || p.was))) &&
    (!st.flats || p.flat) && (!st.beds || String(p.beds) === st.beds) && (!q || p.text.includes(q)));
  list.sort(sorters[st.sort] || sorters.rec);
  const label = {all:"properties", new:"new in the last 7 days", reduced:"reduced"}[st.view];
  $("count").textContent = `${list.length} ${label}${st.flats ? " · flats only" : ""}`;
  $("grid").innerHTML = list.length ? list.map(card).join("")
    : `<div class="empty">${LIST.length ? "Nothing matches these filters." : "No properties yet – the page fills in after the alert tool runs."}</div>`;
  LS.set("brrr_dash", st);
}

document.addEventListener("click", e => {
  const v = e.target.closest("[data-view]");
  if(v){ st.view = v.dataset.view; if(v.classList.contains("stat")) st.flats = false; render(); return; }
  if(e.target.closest("[data-flats]")){ st.view = "all"; st.flats = true; render(); return; }
  if(e.target.id === "flatChip"){ st.flats = !st.flats; render(); return; }
  const h = e.target.closest("[data-hist]");
  if(h){ const box = h.closest(".body").querySelector(".hist"); box.classList.toggle("on");
         h.textContent = box.classList.contains("on") ? "Hide history" : "History"; }
  const cb = e.target.closest("[data-comps]");
  if(cb){ const box = cb.closest(".body").querySelector(".clist"); box.classList.toggle("on");
          cb.textContent = box.classList.contains("on") ? "Hide sales" : "Sold nearby"; }
  const tb = e.target.closest("[data-tab]");
  if(tb){ showTab(tb.dataset.tab, true); return; }
  const stc = e.target.closest("[data-st]");
  if(stc){ ss.type = stc.dataset.st; ss.shown = 100; renderSold(); }
});
$("sort").onchange = e => { st.sort = e.target.value; render(); };
$("beds").onchange = e => { st.beds = e.target.value; render(); };
$("q").oninput = e => { st.q = e.target.value; render(); };

// ---------- tabs
let map = null;
function showTab(name, push){
  if(!["listings","map","sold"].includes(name)) name = "listings";
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.id === "tab-" + name));
  if(push && location.hash !== "#" + name) history.replaceState(null, "", name === "listings" ? location.pathname : "#" + name);
  if(name === "map") initMap();
  if(name === "sold") renderSold();
}
window.addEventListener("hashchange", () => showTab(location.hash.slice(1)));

// ---------- map
const SOLD = (DATA && DATA.sold) || [];
let mLayers = {}, mState = {flats:true, houses:true, sold:"off", yrs:"1"};
function initMap(){
  if(map){ setTimeout(()=>map.invalidateSize(), 50); return; }
  if(typeof L === "undefined"){ $("map").innerHTML = '<p class="empty">The map couldn\'t load. Check your internet connection and refresh.</p>'; return; }
  const c = (DATA && DATA.centre && DATA.centre[0]) ? DATA.centre : [50.4352,-3.5687];
  map = L.map("map").setView(c, 13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
  if(DATA) L.circle(c, {radius: DATA.criteria.radius*1609.34, color:"#0f3d3e", weight:1.5, dashArray:"6 6", fill:false}).addTo(map);
  mLayers.listings = L.layerGroup().addTo(map); mLayers.sold = L.layerGroup().addTo(map);
  drawMap();
  setTimeout(()=>map.invalidateSize(), 50);
}
function drawMap(){
  if(!map) return;
  mLayers.listings.clearLayers(); mLayers.sold.clearLayers();
  const cut = new Date(Date.now() - (+mState.yrs)*365.25*864e5).toISOString().slice(0,10);
  if(mState.sold !== "off"){
    SOLD.forEach(r => {
      const [d,pr,t,a,pc,lat,lon] = r;
      if(d < cut) return;
      if(mState.sold === "F" && t !== "F") return;
      if(mState.sold === "H" && !"TSD".includes(t)) return;
      L.circleMarker([lat,lon], {radius:4, color:"#6b716e", weight:1, fillColor:"#8a8f8c", fillOpacity:.7})
        .bindPopup(`<div class="pop"><b>${gbp(pr)}</b> · sold ${esc(dfmt(d))}<br>${esc(TYPENAME[t]||t)} · ${esc(a)}, ${esc(pc)}</div>`)
        .addTo(mLayers.sold);
    });
  }
  const pts = [];
  LIST.forEach(p => {
    if(p.lat == null) return;
    if(p.flat ? !mState.flats : !mState.houses) return;
    const col = p.flat ? "#1f5fbf" : "#16794a";
    const m = L.circleMarker([p.lat,p.lon], {radius: p.newWeek ? 9 : 7, color: p.reducedRecent || p.was ? "#b42318" : "#fff",
      weight: p.reducedRecent || p.was ? 3 : 1.5, fillColor: col, fillOpacity: .95});
    const was = p.was ? `<div style="color:#b42318">was ${gbp(p.was)}</div>` : "";
    const comp = p.comps && p.comps.n ? `<div>Sold nearby median ${gbp(p.comps.median)} (${p.comps.n})</div>` : "";
    m.bindPopup(`<div class="pop">${p.image ? `<img src="${esc(p.image)}" alt="" onerror="this.remove()">` : ""}
      <b>${gbp(p.price)}</b> ${was}<div>${p.beds} bed ${esc(p.type||"property")}</div><div>${esc(p.address)}</div>${comp}
      <div style="margin-top:6px;display:flex;gap:10px">${p.links.map(([,n,u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)} ↗</a>`).join("")}
      <a href="${dealLink(p)}" target="_blank">Analyse deal</a></div></div>`, {maxWidth:240});
    m.addTo(mLayers.listings); pts.push([p.lat,p.lon]);
  });
}
$("m_flats").onclick = e => { mState.flats = !mState.flats; e.target.classList.toggle("on", mState.flats); drawMap(); };
$("m_houses").onclick = e => { mState.houses = !mState.houses; e.target.classList.toggle("on", mState.houses); drawMap(); };
$("m_sold").onchange = e => { mState.sold = e.target.value; drawMap(); };
$("m_soldyrs").onchange = e => { mState.yrs = e.target.value; drawMap(); };

// ---------- sold prices tab
let ss = {type:"F", yrs:"1", sort:"new", q:"", shown:100};
const median = a => { if(!a.length) return null; const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length%2 ? s[m] : (s[m-1]+s[m])/2; };
function renderSold(){
  const info = (DATA && DATA.soldInfo) || {};
  document.querySelectorAll("[data-st]").forEach(c => c.classList.toggle("on", c.dataset.st === ss.type));
  $("s_yrs").value = ss.yrs; $("s_sort").value = ss.sort;
  if(!SOLD.length){
    $("sstats").innerHTML = ""; $("s_body").innerHTML = ""; $("s_more").style.display = "none";
    $("s_count").textContent = "No sold prices yet. They're downloaded on the next check (once a week), then appear here.";
    return;
  }
  const cut = new Date(Date.now() - (+ss.yrs)*365.25*864e5).toISOString().slice(0,10);
  const inYrs = SOLD.filter(r => r[0] >= cut);
  const stat = (t, label) => { const a = inYrs.filter(r => r[2] === t).map(r => r[1]); return `<div class="stat" style="cursor:default"><div class="v">${a.length ? gbp(median(a)) : "–"}</div><div class="l">${label} · median of ${a.length}</div></div>`; };
  $("sstats").innerHTML = stat("F","Flats") + stat("T","Terraced") + stat("S","Semi") + stat("D","Detached") +
    `<div class="stat" style="cursor:default"><div class="v">${inYrs.length}</div><div class="l">Sales in ${ss.yrs==="1" ? "the last 12 months" : "the last " + ss.yrs + " years"}</div></div>`;
  const q = ss.q.trim().toLowerCase();
  let rows = inYrs.filter(r => (!ss.type || r[2] === ss.type) && (!q || (r[3] + " " + r[4]).toLowerCase().includes(q)));
  const so = {new:(a,b)=>b[0].localeCompare(a[0]), cheap:(a,b)=>a[1]-b[1], dear:(a,b)=>b[1]-a[1], near:(a,b)=>a[9]-b[9]}[ss.sort];
  rows.sort(so);
  const md = median(rows.map(r => r[1]));
  $("s_count").textContent = `${rows.length} sales${md ? ` · median ${gbp(md)}` : ""} · within ${DATA.criteria.radius} miles of ${DATA.criteria.outcode} · up to ${gbp(info.maxPrice)}`;
  $("s_body").innerHTML = rows.slice(0, ss.shown).map(r => `<tr><td>${esc(dfmt(r[0]))}</td><td>${esc(r[3])}${r[8] ? " <small>(new build)</small>" : ""}</td>
    <td class="hide-s">${esc(r[4])}</td><td class="hide-s">${esc(TYPENAME[r[2]]||r[2])}${r[7]==="L" ? " · leasehold" : ""}</td><td class="num">${gbp(r[1])}</td></tr>`).join("");
  $("s_more").style.display = rows.length > ss.shown ? "block" : "none";
  $("s_attr").textContent = `${info.attribution || ""} Sold prices updated ${info.updated ? dfmt(info.updated) : "–"}. Land Registry records sales 1–2 months after completion and doesn't record bedrooms.`;
}
$("s_yrs").onchange = e => { ss.yrs = e.target.value; ss.shown = 100; renderSold(); };
$("s_sort").onchange = e => { ss.sort = e.target.value; renderSold(); };
$("s_q").oninput = e => { ss.q = e.target.value; ss.shown = 100; renderSold(); };
$("s_more").onclick = () => { ss.shown += 200; renderSold(); };

header(); render(); showTab(location.hash.slice(1));
</script>
</body>
</html>
