<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRRR Deal Finder</title>
<style>
:root{
  --bg:#f4f5f2;--card:#fff;--ink:#16201f;--muted:#5f6b69;--line:#e1e4de;
  --brand:#0f3d3e;--brand2:#1d6b5f;--good:#16794a;--bad:#b42318;--warn:#b26b00;--chip:#eef1ec;--blue:#1f5fbf;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1413;--card:#172120;--ink:#e8eeec;--muted:#93a29f;--line:#25312f;
  --brand:#0b2b2c;--brand2:#3fb39b;--good:#4cc38a;--bad:#ff7a6b;--warn:#f0b44c;--chip:#1e2a28;--blue:#7fb0ff;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--brand);color:#fff}
.wrap{max-width:1240px;margin:0 auto;padding:0 18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0 4px;flex-wrap:wrap}
.top h1{margin:0;font-size:21px}
.top a{color:#fff;text-decoration:none;font-weight:600;background:rgba(255,255,255,.14);padding:8px 14px;border-radius:9px}
.top a:hover{background:rgba(255,255,255,.22)}
.sub{color:rgba(255,255,255,.75);font-size:13.5px;padding-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0 12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.stat:hover{border-color:var(--brand2)}
.stat .v{font-size:26px;font-weight:750;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted)}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 13px;border-radius:20px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.chip.on{background:var(--brand2);border-color:var(--brand2);color:#fff}
.controls select,.controls input[type=search]{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 11px;border-radius:9px;font:inherit;font-size:14px}
.controls input[type=search]{flex:1;min-width:180px}
.spacer{flex:1}
.count{color:var(--muted);font-size:13.5px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:3/2;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tags{position:absolute;left:8px;top:8px;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.3px;padding:3px 7px;border-radius:5px;color:#fff}
.t-new{background:var(--good)}.t-flat{background:var(--blue)}.t-red{background:var(--bad)}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.price{font-size:21px;font-weight:750;font-variant-numeric:tabular-nums}
.price small{font-size:12.5px;font-weight:500;color:var(--muted)}
.was{font-size:13px;color:var(--bad);font-variant-numeric:tabular-nums}
.what{font-weight:650}
.addr{color:var(--ink)}
.meta{font-size:12.5px;color:var(--muted)}
.links{font-size:13px;display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.links a{color:var(--brand2);font-weight:600;text-decoration:none}
.links a:hover{text-decoration:underline}
.acts{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.btn{flex:1;text-align:center;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 10px;border-radius:9px;font:inherit;font-weight:650;font-size:14px;cursor:pointer;text-decoration:none}
.btn.p{background:var(--brand2);border-color:var(--brand2);color:#fff}
.hist{display:none;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;font-variant-numeric:tabular-nums}
.hist.on{display:block}
.hist div{display:flex;justify-content:space-between}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 10px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.top h1{font-size:18px}}
</style>
</head>

:null,"reducedRecent":false,"history":[[89900,"2026-11-16"]],"links":[["onthemarket","OnTheMarket","https://www.onthemarket.com/details/18392255/"]]},{"id":"melville torquay tq2|2","price":95000,"was":null,"beds":2,"type":"Terraced bungalow","flat":false,"address":"Melville Lane, Torquay TQ2","title":"2 bedroom terraced bungalow for sale","agent":"eXp UK - South West","status":"Added > 14 days","qualifier":"Guide price","image":"https://media.onthemarket.com/properties/20277827/1642342495/image-0-480x320.jpg","dist":2.7,"firstSeen":"2026-11-16","isNew":false,"reducedDate":null,"reducedRecent":false,"history":[[95000,"2026-11-16"]],"links":[["onthemarket","OnTheMarket","https://www.onthemarket.com/details/20277827/"]]},{"id":"braddons hill torquay tq1 west|2","price":115000,"was":null,"beds":2,"type":"Flat","flat":true,"address":"Braddons Hill Road West, Torquay TQ1","title":"2 bedroom flat for sale","agent":"eXp UK - South West","status":"Added > 14 days","qualifier":"","image":"https://media.onthemarket.com/properties/20256880/1658220154/image-0-480x320.jpg","dist":2.7,"firstSeen":"2026-11-16","isNew":false,"reducedDate":null,"reducedRecent":false,"history":[[115000,"2026-11-16"]],"links":[["onthemarket","OnTheMarket","https://www.onthemarket.com/details/20256880/"]]}]};
const $ = id => document.getElementById(id);
const gbp = n => n==null ? "–" : "£" + Math.round(n).toLocaleString("en-GB");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dfmt = iso => { if(!iso) return ""; const d = new Date(iso + "T12:00:00"); return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); };
const weekAgo = new Date(Date.now() - 7*864e5).toISOString().slice(0,10);

const LS = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
             set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
let st = Object.assign({view:"all", flats:false, sort:"rec", q:"", beds:""}, LS.get("brrr_dash", {}));

const L = (DATA && DATA.listings) || [];
L.forEach(p => {
  p.newWeek = p.isNew && p.firstSeen >= weekAgo;
  p.cut = p.was ? p.was - p.price : 0;
  p.text = [p.address, p.type, p.title, p.agent].join(" ").toLowerCase();
});

function header(){
  if(!DATA){ $("sub").textContent = "No data yet – run the alert tool once to fill this page."; return; }
  const c = DATA.criteria;
  $("sub").textContent = `${c.minBeds}–${c.maxBeds} beds · ${gbp(c.minPrice)}–${gbp(c.maxPrice)} · within ${c.radius} miles of ${c.outcode} · updated ${DATA.generated}`;
  $("l_red").textContent = `Reduced in the last ${c.reducedMonths} months`;
  $("n_all").textContent = L.length;
  $("n_new").textContent = L.filter(p=>p.newWeek).length;
  $("n_red").textContent = L.filter(p=>p.reducedRecent).length;
  $("n_flat").textContent = L.filter(p=>p.flat).length;
}

function dealLink(p){
  const gdv = Math.round(p.price*1.25/5000)*5000;
  const pre = { price:p.price, name:`${p.beds} bed ${p.type||"property"}, ${p.address}`.slice(0,90),
                service: p.flat ? 100 : 0, gdv, listingUrl: p.links[0] ? p.links[0][2] : "", fromDashboard:1 };
  return "deal-calculator.html#prefill=" + encodeURIComponent(JSON.stringify(pre));
}

function card(p){
  const tags = [];
  if(p.newWeek) tags.push('<span class="tag t-new">NEW</span>');
  if(p.flat) tags.push('<span class="tag t-flat">FLAT</span>');
  if(p.reducedRecent) tags.push(`<span class="tag t-red">REDUCED ${esc(dfmt(p.reducedDate)).toUpperCase()}</span>`);
  const img = p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy" onerror="this.remove()">` : "";
  const was = p.was ? `<div class="was">was ${gbp(p.was)} · down ${gbp(p.cut)} (${(p.cut/p.was*100).toFixed(1)}%)</div>`
            : (p.reducedRecent ? `<div class="was">Reduced ${esc(dfmt(p.reducedDate))} (previous price not published)</div>` : "");
  const meta = [p.dist!=null ? `${p.dist} mi from TQ4 centre` : "", p.agent, `first seen ${dfmt(p.firstSeen)}`].filter(Boolean).map(esc).join(" · ");
  const links = p.links.map(([, name, url]) => `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(name)} ↗</a>`).join("");
  const hist = p.history.length > 1 ? p.history.map(([pr, d]) => `<div><span>${esc(dfmt(d))}</span><span>${gbp(pr)}</span></div>`).join("") : "";
  return `<div class="card">
    <div class="ph">${img}<span>${img ? "" : "No photo"}</span><div class="tags">${tags.join("")}</div></div>
    <div class="body">
      <div class="price">${gbp(p.price)} <small>${esc(p.qualifier)}</small></div>
      ${was}
      <div class="what">${p.beds} bed ${esc(p.type || "property")}</div>
      <div class="addr">${esc(p.address)}</div>
      <div class="meta">${meta}</div>
      <div class="links">${links}</div>
      ${hist ? `<div class="hist">${hist}</div>` : ""}
      <div class="acts">
        ${hist ? `<button class="btn" data-hist>Price history</button>` : ""}
        <a class="btn p" href="${dealLink(p)}" target="_blank">Analyse deal</a>
      </div>
    </div></div>`;
}

const sorters = {
  rec: (a,b) => (b.flat-a.flat) || ((b.reducedRecent?b.reducedDate:"") > (a.reducedRecent?a.reducedDate:"") ? 1 : (b.reducedRecent?b.reducedDate:"") < (a.reducedRecent?a.reducedDate:"") ? -1 : 0) || a.price-b.price,
  newest: (a,b) => b.firstSeen.localeCompare(a.firstSeen) || a.price-b.price,
  cheap: (a,b) => a.price-b.price,
  dear: (a,b) => b.price-a.price,
  cut: (a,b) => (b.cut/(b.was||1)) - (a.cut/(a.was||1)) || ((b.reducedDate||"").localeCompare(a.reducedDate||"")),
  near: (a,b) => (a.dist ?? 99) - (b.dist ?? 99),
};

function render(){
  document.querySelectorAll(".chip[data-view]").forEach(c => c.classList.toggle("on", c.dataset.view === st.view));
  $("flatChip").classList.toggle("on", st.flats);
  $("sort").value = st.sort; $("q").value = st.q; $("beds").value = st.beds;
  const q = st.q.trim().toLowerCase();
  let list = L.filter(p =>
    (st.view === "all" || (st.view === "new" && p.newWeek) || (st.view === "reduced" && (p.reducedRecent || p.was))) &&
    (!st.flats || p.flat) && (!st.beds || String(p.beds) === st.beds) && (!q || p.text.includes(q)));
  list.sort(sorters[st.sort] || sorters.rec);
  const label = {all:"properties", new:"new in the last 7 days", reduced:"reduced"}[st.view];
  $("count").textContent = `${list.length} ${label}${st.flats ? " · flats only" : ""}`;
  $("grid").innerHTML = list.length ? list.map(card).join("")
    : `<div class="empty">${L.length ? "Nothing matches these filters." : "No properties yet – the page fills in after the alert tool runs."}</div>`;
  LS.set("brrr_dash", st);
}

document.addEventListener("click", e => {
  const v = e.target.closest("[data-view]");
  if(v){ st.view = v.dataset.view; if(v.classList.contains("stat")) st.flats = false; render(); return; }
  if(e.target.closest("[data-flats]")){ st.view = "all"; st.flats = true; render(); return; }
  if(e.target.id === "flatChip"){ st.flats = !st.flats; render(); return; }
  const h = e.target.closest("[data-hist]");
  if(h){ const box = h.closest(".body").querySelector(".hist"); box.classList.toggle("on");
         h.textContent = box.classList.contains("on") ? "Hide history" : "Price history"; }
});
$("sort").onchange = e => { st.sort = e.target.value; render(); };
$("beds").onchange = e => { st.beds = e.target.value; render(); };
$("q").oninput = e => { st.q = e.target.value; render(); };

header(); render();
</script>
